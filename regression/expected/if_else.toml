  ["entry",    "if.else",  "F"],
  ["if.then",  "if.end4",  "U"],
  ["if.else",  "if.then2", "T"],
  ["if.else",  "if.else3", "F"],
  ["if.then2", "if.end",   "U"],
  ["if.else3", "if.end",   "U"],
  ["if.end",   "if.end4",  "U"],
]

[[function.block]]
name = "entry"
lines = [19]
code = "if (x > 0)"
cond = "x > 0"
ir = "icmp sgt"

[[function.block]]
name = "if.then"
lines = [20]
