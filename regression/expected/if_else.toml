# Expected CFG (hand-derived) for regression/c/if_else.c. Block names are the ones Clang -O0 generates.
# Checked against LLVM (opt -passes=dot-cfg) by tests/test_regression_cfgs.py. Format: src/cfgverify/expected.py
program = "if_else.c"
construct = "if-else; else-if chain"

[[function]]
name = "max2"
decisions = 1
exits = ["if.end"]
back_edges = []
edges = [
  ["entry",   "if.then", "T"],
  ["entry",   "if.else", "F"],
  ["if.then", "if.end",  "U"],
  ["if.else", "if.end",  "U"],
]

[[function.block]]
name = "entry"
lines = [10]
code = "if (a > b)"
cond = "a > b"
ir = "icmp sgt"

[[function.block]]
name = "if.then"
lines = [11]
code = "m = a;"

[[function.block]]
name = "if.else"
lines = [13]
code = "m = b;"

[[function.block]]
name = "if.end"
lines = [14]
code = "return m;"

