[[function.block]]
name = "if.end"
lines = [16]
code = "sum += i;"

[[function.block]]
name = "for.inc"
lines = [13]
code = "i++   (step)"

[[function.block]]
name = "for.end"
lines = [18]
code = "return sum;"

