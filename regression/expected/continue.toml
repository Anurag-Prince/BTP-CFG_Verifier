edges = [
  ["entry",      "while.cond", "U"],
  ["while.cond", "while.body", "T"],
  ["while.cond", "while.end",  "F", "leave the loop"],
  ["while.body", "if.then",    "T"],
  ["while.body", "if.end",     "F"],
  ["if.then",    "while.cond", "U", "continue: straight back to the condition"],
