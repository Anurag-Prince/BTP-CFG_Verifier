# Expected CFG (hand-derived) for regression/c/continue.c. Block names are the ones Clang -O0 generates.
# Checked against LLVM (opt -passes=dot-cfg) by tests/test_regression_cfgs.py. Format: src/cfgverify/expected.py
program = "continue.c"
construct = "continue"

[[function]]
name = "sum_odd"
decisions = 2
exits = ["for.end"]
back_edges = [["for.inc", "for.cond"]]
loops = [{ header = "for.cond", depth = 1, body = ["for.cond", "for.body", "if.then", "if.end", "for.inc"] }]
edges = [
  ["entry",    "for.cond", "U"],
  ["for.cond", "for.body", "T"],
  ["for.cond", "for.end",  "F", "leave the loop"],
  ["for.body", "if.then",  "T"],
  ["for.body", "if.end",   "F"],
  ["if.then",  "for.inc",  "U", "continue: go to the step"],
  ["if.end",   "for.inc",  "U"],
  ["for.inc",  "for.cond", "U"],
]

[[function.block]]
name = "entry"
lines = [12, 13]
code = "sum = 0;  int i = 1"

[[function.block]]
name = "for.cond"
lines = [13]
code = "i <= n"
cond = "i <= n"
ir = "icmp sle"

[[function.block]]
name = "for.body"
lines = [14]
