[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfgverify"
version = "0.1.0"
description = "Control-flow consistency verification between C/HLL (via LLVM IR) and assembly"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohit" }]
# Exact pins live in requirements.txt; these are the minimum declarations.
dependencies = ["llvmlite", "networkx>=3.2", "pydot>=3", "graphviz>=0.20", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cfgverify = "cfgverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfgverify = ["model/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# pydot uses pyparsing APIs that newer pyparsing marks as deprecated; harmless, so hide the noise.
filterwarnings = ["ignore:'setParseAction' deprecated"]
